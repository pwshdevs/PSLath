version: 0.1.0.{build}

environment:
  matrix:
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
      PowerShellEdition: PowerShellCore
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
      PowerShellEdition: WindowsPowerShell

skip_commits:
  message: /updated readme.*|update readme.*s/
build: off

# Kick off the CI/CD pipeline
test_script:
  - ps:   if ($env:PowerShellEdition -eq 'WindowsPowerShell') { .\build.ps1 -Task Test -Bootstrap }
  - pwsh: if ($env:PowerShellEdition -eq 'PowerShellCore')    { .\build.ps1 -Task Test -Bootstrap }

# Configure PSGALLERY_API_KEY as a secure environment variable in AppVeyor.
# Publish only once from the PowerShell Core matrix job on non-PR main builds.
deploy_script:
  - pwsh: if ($env:PowerShellEdition -eq 'PowerShellCore' -and $env:APPVEYOR_REPO_BRANCH -eq 'main' -and -not $env:APPVEYOR_PULL_REQUEST_NUMBER) { .\tools\Publish-PSGallery.ps1 }
